[project]
name = "vcs-protocol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8,<9"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
vcs-protocol = "vcs_protocol:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
